# Collects recent Deezer plays every 30 minutes, even when your computer is off.
# The SQLite database lives in this repository on the branch `data` (one commit, replaced at
# every run, so the repository does not grow). No database account is needed.
#
# Secrets (Settings > Secrets and variables > Actions): DEEZER_ARL.
# Variables (same page, "Variables" tab): DEEZER_PROFILE (Family profile name, e.g. TBTC),
# MUSICBRAINZ_CONTACT (optional: an email or URL for the MusicBrainz User-Agent).
#
# Notes:
# - GitHub cron runs are often delayed by a few minutes; Deezer keeps the last 100 plays,
#   so a delayed run loses nothing.
# - Each run takes about a minute: unlimited on a public repository.
# - On public repositories GitHub pauses scheduled workflows after 60 days without a commit
#   on the default branch; it emails you first. Re-enable it in the Actions tab.

name: Deezer sync

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write   # publish the database on the data branch

concurrency:
  group: deezer-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      DEEZER_ARL: ${{ secrets.DEEZER_ARL }}
      DEEZER_PROFILE: ${{ vars.DEEZER_PROFILE }}
      MUSICBRAINZ_CONTACT: ${{ vars.MUSICBRAINZ_CONTACT }}
      LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
      DISCOGS_TOKEN: ${{ secrets.DISCOGS_TOKEN }}
      DATABASE_URL: sqlite:///data/deezer_stats.db
      DEEZER_STATS_STORAGE: git
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Get the published database
        run: python -m scripts.cloud_db pull

      - name: Sync Deezer history
        run: python -m scripts.sync --enrich-budget 120

      - name: Publish the database
        run: python -m scripts.cloud_db push

      - name: Keep unexpected Deezer responses for debugging
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: sync-logs
          path: logs/
          if-no-files-found: ignore
          retention-days: 7
