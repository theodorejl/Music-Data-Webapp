[theme]
base = "light"
# "Noto" direction: white page, grainy pastel mesh panels, Google Sans Flex, vivid pastel data colours.
primaryColor = "#1f1f1f"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f0f4f9"
textColor = "#1f1f1f"
linkColor = "#0b57d0"
linkUnderline = false
borderColor = "#e3e8ef"
dataframeBorderColor = "#eef1f5"
dataframeHeaderBackgroundColor = "#f6f8fb"
showWidgetBorder = false
showSidebarBorder = false
baseRadius = "16px"
buttonRadius = "999px"
font = "Google Sans Flex:https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght@6..144,300..800&display=swap"
headingFont = "Google Sans Flex:https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght@6..144,300..800&display=swap"
baseFontSize = 15
metricValueFontSize = "40px"
metricValueFontWeight = 400
# Validated categorical order (dataviz validator: CVD ΔE ≥ 9.9): sky, coral, lilac, lime, rose, butter, teal.
chartCategoricalColors = ["#1e9fd8", "#ff6f4d", "#8b6cf0", "#4fae2c", "#e8558e", "#d39a06", "#119f86"]
chartSequentialColors = ["#f3fbe9", "#e2f5c8", "#c4ebb0", "#9fdcb0", "#6cc9b4", "#3fb3b0", "#1e9fd8", "#2f7fd0", "#4a5fc4", "#3a2584"]

[theme.sidebar]
backgroundColor = "#f0f4f9"
secondaryBackgroundColor = "#ffffff"

[server]
headless = true
# Code edits are picked up by app/devreload.py (whole-project reload in the script thread);
# Streamlit's own watcher is off because it races with imports and leaves the page broken.
# Settings and library changes are handled by scripts/dev_server.py, which restarts the app.
fileWatcherType = "none"

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
