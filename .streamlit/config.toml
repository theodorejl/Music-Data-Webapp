[theme]
base = "light"
# Soft stone ground, white surfaces, ink text, one periwinkle accent.
primaryColor = "#6C7FE8"
backgroundColor = "#EFEEEA"
secondaryBackgroundColor = "#F7F6F3"
textColor = "#17171A"
linkColor = "#4B5BC4"
linkUnderline = false
borderColor = "#E4E2DD"
dataframeBorderColor = "#ECEAE5"
dataframeHeaderBackgroundColor = "#F4F3EF"
showWidgetBorder = false
showSidebarBorder = false
baseRadius = "14px"
buttonRadius = "999px"
font = "Geist:https://fonts.googleapis.com/css2?family=Geist:wght@300..700&display=swap"
headingFont = "Geist:https://fonts.googleapis.com/css2?family=Geist:wght@300..700&display=swap"
codeFont = "Geist Mono:https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400..600&display=swap"
baseFontSize = 15
metricValueFontSize = "2.4rem"
metricValueFontWeight = 400
# Validated categorical order (dataviz validator: CVD ΔE ≥ 9.9, normal-vision ΔE ≥ 18.1).
chartCategoricalColors = ["#6C7FE8", "#EE8E66", "#9B7FD9", "#3FB58E", "#D9A93A", "#E07FA8"]
chartSequentialColors = ["#F2F3FD", "#DDE2FB", "#C3CBF6", "#A4B0F1", "#8796EC", "#6C7FE8", "#5465CF", "#3F4EAE", "#2E3A88", "#202963"]

[theme.sidebar]
backgroundColor = "#F7F6F3"
secondaryBackgroundColor = "#EFEEEA"

[server]
headless = true

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
