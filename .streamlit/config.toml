[theme]
base = "light"
# taste-skill app style "pastel-consumer": #f3f5f7 ground, white panels, ink text, one cobalt accent on data.
primaryColor = "#1d5fd6"
backgroundColor = "#f3f5f7"
secondaryBackgroundColor = "#f2f8fd"
textColor = "#1b1d1f"
linkColor = "#1d5fd6"
linkUnderline = false
borderColor = "#e6e6e6"
dataframeBorderColor = "#f4f4f4"
dataframeHeaderBackgroundColor = "#ffffff"
showWidgetBorder = false
showSidebarBorder = false
baseRadius = "10px"
buttonRadius = "10px"
font = "Manrope:https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600&display=swap"
headingFont = "Manrope:https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600&display=swap"
baseFontSize = 15
metricValueFontSize = "26px"
metricValueFontWeight = 400
# taste-skill pastel-consumer chart hues (one hue per chart).
chartCategoricalColors = ["#1d5fd6", "#b45309", "#2a8798"]
chartSequentialColors = ["#f5f8fe", "#eef4fd", "#dcf1ff", "#c7defa", "#b9d3f6", "#8fb3ee", "#5f8de3", "#1d5fd6", "#164ca9", "#0a3a80"]

[theme.sidebar]
backgroundColor = "#f3f5f7"
secondaryBackgroundColor = "#ffffff"

[server]
headless = true
# Apply code changes without restarting: the page reruns as soon as a file is saved.
runOnSave = true
fileWatcherType = "auto"
folderWatchBlacklist = [".venv", "data", "logs", "Exports Excel", "tests", ".git"]

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
