<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!-- DatAtlaSonore: a minimal record in black and white. Each groove is an incomplete ring
       turning at its own speed, so the gaps show the disc spinning. -->
  <style>
    .spin { transform-box: view-box; transform-origin: 32px 32px; animation: spin linear infinite; }
    .g1 { animation-duration: 12s; }
    .g2 { animation-duration: 7.5s; }
    .g3 { animation-duration: 16s; }
    .g4 { animation-duration: 5s; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .spin { animation: none; } }
  </style>
  <circle cx="32" cy="32" r="31" fill="#111111"/>
  <circle class="spin g1" cx="32" cy="32" r="26" fill="none" stroke="#ffffff" stroke-width="1.6"
          stroke-linecap="round" pathLength="100" stroke-dasharray="62 6 24 8"/>
  <circle class="spin g2" cx="32" cy="32" r="21.5" fill="none" stroke="#ffffff" stroke-opacity="0.55" stroke-width="1.6"
          stroke-linecap="round" pathLength="100" stroke-dasharray="40 9 38 13"/>
  <circle class="spin g3" cx="32" cy="32" r="17" fill="none" stroke="#ffffff" stroke-width="1.6"
          stroke-linecap="round" pathLength="100" stroke-dasharray="78 22"/>
  <circle cx="32" cy="32" r="10" fill="#ffffff"/>
  <circle class="spin g4" cx="32" cy="32" r="6.4" fill="none" stroke="#111111" stroke-opacity="0.35" stroke-width="1"
          pathLength="100" stroke-dasharray="70 30"/>
  <circle cx="32" cy="32" r="1.8" fill="#111111"/>
</svg>
